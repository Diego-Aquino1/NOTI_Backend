version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: noti_postgres_dev
    environment:
      POSTGRES_DB: ${DB_NAME:-noti_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./SQL:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - noti_network_dev

  # Backend API Service (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: noti_backend_dev
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-noti_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=True
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - noti_network_dev
    volumes:
      - .:/app
    command: ["python", "-m", "backend.api.main"]
    restart: unless-stopped

  # Scraping Service (Development)
  scraping:
    build:
      context: .
      dockerfile: Dockerfile.scraping
    container_name: noti_scraping_dev
    environment:
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-noti_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - SCRAPING_HOST=0.0.0.0
      - SCRAPING_PORT=8001
      - DEBUG=True
    ports:
      - "8001:8001"
    depends_on:
      - postgres
    networks:
      - noti_network_dev
    volumes:
      - .:/app
    command: ["python", "-m", "scraping.api.main"]
    restart: unless-stopped

volumes:
  postgres_data_dev:

networks:
  noti_network_dev:
    driver: bridge
